<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">  
	<link rel="stylesheet" href="css/estilos.css">
	<link rel="icon" href="img/ico/Falco.png">
	<title>Formulario Línea</title>
</head>

	<script>
	document.getElementById('formulario').addEventListener('submit', function (e) {
		const input = document.getElementById('No_Unidad');
		const value = input.value.trim().toUpperCase();

		// Verifica si ya tiene el prefijo MX-
		if (!value.startsWith('MX-')) {
			input.value = 'MX-' + value;
		}
		});
	</script>

<body>
	<div class="contenedor">
		<div class="columna-izquierda-full">
			<div class="registro activo" id="registro">
				<div class="header-1">
					<h1>Agrupamientos</h1>
				</div>

				<form class="formulario" id="formulario">

					<i Style="color: white;-webkit-user-select: none; -ms-user-select: none; user-select: none; /* Standard syntax */">
						<script id="Fecha" name="Fecha">
						  function makeArray() {
							for (i = 0; i < makeArray.arguments.length; i++) this[i + 1] = makeArray.arguments[i]
						  }
						  var months = new makeArray('Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre');
						  var date = new Date();
						  var day = date.getDate();
						  var month = date.getMonth() + 1;
						  var yy = date.getYear();
						  var year = (yy < 1000) ? yy + 1900 : yy;
						  var hours = date.getHours();
						  var minutes = date.getMinutes();

						  document.write( day + "/" + months[month] + "/" + year + "  " + hours + ":" + minutes);
						</script>
					</i>

					<div class="contenedor-formulario2">
						
						<!-- Zona -->
						<select hidden id="Zona" name="Zona">
							<option style="color: #bdb9b9;"value="Agrupamientos"></option>
						</select>
						
						<!-- Sector style="text-transform: uppercase;"-->
						<span for="Sector">*Sector
							<select id="Sector" name="Sector">
								<option style="color: #bdb9b9;"value="false">-Elige una opción-</option>
								<option value='Ambiental'>Ambiental</option>
								<option value='DUCS'>DUCS</option>
								<option value='Femenil'>Femenil</option>
								<option value='Fuerza de Tarea'>Fuerza de Tarea</option>
								<option value='GEM'>GEM</option>
								<option value='Montada'>Montada</option>
								<option value='Pol. Transporte'>Pol. Transporte</option>
								<option value='Pol. Turistica'>Pol. Turistica</option>
								<option value='UPM Oriente'>UPM Oriente</option>
								<option value='UPM Poniente'>UPM Poniente</option>
							</select>
						</span>

										
						<!-- Tipo -->
						<span for="Tipo">*Tipo
							<select id="Tipo" name="Tipo">
								<option style="color: #bdb9b9;"value="false">-Elige una opción-</option>
								<option value="Dodge Ram">Dodge Ram</option>
								<option value="Ford F-150">Ford F-150</option>
								<option value="Ford Explorer">Ford Explorer</option>
								<option value="Nissan Sentra">Nissan Sentra</option>
							</select>
						</span>


					
						<div style="padding-top: 5px;" class="contenedor-formulario">


							<!-- Inventario -->
							<div class="contenedor-formulario3" >
								<label for="Inventario">*Inventario</label>
								<div >
									<input maxlength="5" style="width: 150px; text-transform: uppercase;" type="text" id="Inventario" name="Inventario" placeholder="">
								</div>
							</div><br><br>

							
							<!-- Unidad -->
							<div class="contenedor-formulario3" >
								<label for="Economico">*Unidad MX-</label>
								<div >
									<input maxlength="6" style="width: 150px; text-transform: uppercase;" type="text" id="Economico" name="Economico" placeholder="000A-0">
								</div>
							</div>

						</div><br>
						
				
						<!-- TEI -->
						<div class="contenedor-formulario" >
							<label for="TEI">*TEI</label>
							<div style="width: 250px;">
								<input  maxlength="18" style="width: 300px; text-transform: uppercase;" type="text" id="TEI" name="TEI" placeholder="">
							</div>
						</div><br>

						
						<!-- ISSI	 -->
						<div class="contenedor-formulario" >
							<label for="ISSI">*ISSI</label>
							<div style="width: 150px;">
								<input style="background-color: var(--terciario); font-size: 22px; font-weight: 900;" type="text" id="ISSI" name="ISSI" readonly>
							</div>
						</div><br>

						
						<!-- Observaciones -->
						<span for="Observaciones">Observaciones
							<select id="Observaciones" name="Observaciones">
								<option style="color: #bdb9b9;"value="">-Elige una opción-</option>
								<option value="Garantía">Garantía</option>
								<option value="Reprogramación">Reprogramación</option>
								<option value="No enciende luminico y sonoro">No enciende luminico y sonoro</option>
								<option value="No actualiza GPS">No actualiza GPS</option>
							</select>
						</span>



						<!-- Nota -->
						<div class="contenedor-formulario" >
							<label for="Nota">Nota</label>
							<div style="width: 350px;"class="contenedor-input-fecha">
								<input  type="text" id="Nota" name="Nota" placeholder="">
							</div>
						</div>

					</div>
					

					
                    <script>
                        // Función de validación
                        function validarFormulario() {
                            const Sector = document.getElementById('Sector').value;
    						const Tipo = document.getElementById('Tipo').value;

                            // Verificar Capos Vacios "-Elige una opción-"
							if (Sector === "false"||Tipo === "false") {
								alert('Por favor, llene los campos obligatorios');
								return; // Evita que el formulario se envíe
							}

                            // Validar campos de texto obligatorios
							const Inventario = document.getElementById('Inventario').value.trim();
							const Economico = document.getElementById('Economico').value.trim();
							const TEI = document.getElementById('TEI').value.trim();

							if (!Inventario || !Economico || !TEI) {
								alert('Por favor, complete los campos "Inventario", "Económico" y "TEI".');
								return;
							}


                            // Ejecuta cambia_de_pagina() después de la validación exitosa
                            cambia_de_pagina();
                            return true; // Permite el envío del formulario
                        }

                        // Función para cambiar de página y cargar app.js
                        function cambia_de_pagina() {
                            setTimeout(function () {
                                // Coloca aquí la inclusión de app.js
                                var script = document.createElement('script');
                                script.src = 'js/app.js';
                                document.head.appendChild(script);
                                location.href = 'RegistroExitoso.html';
                            }, 1500);
                        }
                    </script>


					<br>
					<div class="contenedor-boton">
						<button type="submit" onclick="javascript:validarFormulario();">
							Registrar
							<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-check" viewBox="0 0 16 16">
								<path d="M10.97 4.97a.75.75 0 0 1 1.07 1.05l-3.99 4.99a.75.75 0 0 1-1.08.02L4.324 8.384a.75.75 0 1 1 1.06-1.06l2.094 2.093 3.473-4.425a.267.267 0 0 1 .02-.022z"/>
							</svg>
						</button>
					</div>

				</form>
				<!-- Termina Formulario -->

			</div>

		</div>

		<div class="columna-derecha">
		</div>

	</div>

	<script src="js/app.js"></script>
	
</body>
</html>
